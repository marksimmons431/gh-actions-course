name: 06 - Contexts

on:
  push:
  workflow_dispatch:

jobs:
  echo-data:
    runs-on: ubuntu-latest
    steps:
      - name: Display Information
        env:
          GITHUB_CONTEXT: ${{toJson(github)}}
        run: |
          echo "JOB NAME: $GITHUB_CONTEXT['job']
          echo "SHA NAME: $GITHUB_CONTEXT['sha']
          echo "REP NAME: $GITHUB_CONTEXT['repository']
          
