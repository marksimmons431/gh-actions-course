name: 12 Working with outputs
on:
  workflow_dispatch:
    inputs:
      build_status:
        type: choice
        options:
          - success
          - failure
        default: success
        required: false
        description: "Build status"

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      build-status: ${{ steps.build.outputs.status }}
    steps:
      - name: Print value of GITHUB_OUTPUT
        run:
          echo "$GITHUB_OUTPUT"
      - name: Build
        id: build
        run: |
          echo "status=success" >> "$GITHUB_OUTPUT"

  deploy:
    runs-on: ubuntu-latest
    needs: build
    if: ${{needs.build.outputs.build-status == 'success'}}
    steps:
      - name: Deploy
        run: |
          echo "Deploying"

