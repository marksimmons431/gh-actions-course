name: 12 Working with outputs
on:
  workflow_dispatch:
    inputs:
      build_status:
        type: choice
        options:
          - success
          - failure
        default: success
        required: false
        description: "Build status"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Print GITHUB_OUTPUT path
        run: |
          echo "$GITHUB_OUTPUT"
      - name: Build
        id: build
        run: |
          echo "STATUS: ${{steps.build.outcome}}" >> $GITHUB_OUTPUT 

  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Build test
        if: ${{steps.build.outcome == 'success'}}
        run: |
          echo "Deploying"

