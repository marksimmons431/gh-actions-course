name: 26 - Run Copilot Code Review
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize]
permissions:
  contents: read
  pull-requests: write
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: NoahLundSyrdal/prReviewer@v1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}